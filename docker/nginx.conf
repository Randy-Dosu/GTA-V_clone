server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip compression for text-based assets
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json application/javascript
                    application/xml+rss application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA fallback — all routes serve index.html (Vite single-page app)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed Vite build assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Short cache for static public files (favicon, music manifest)
    location ~* \.(svg|png|jpg|jpeg|gif|ico|json|mp3|m4a|ogg|opus|wav|flac|aac)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Never cache the HTML shell
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store";
    }
}
