services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gta-v-los-santos:latest
    container_name: gta-v-los-santos
    ports:
      - "5173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
